<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>스토리 보카</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b5bf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스토리 보카">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fb;--bg2:#e9eaf7;--card:#ffffff;--card2:#f7f7fd;--ink:#171a2c;--sub:#626a85;--mute:#9aa1b8;--line:#e3e5f1;
  --pri:#5b5bf0;--pri2:#8b5cf6;--pri-ink:#ffffff;--soft:#eeedff;--acc:#ff8a4c;--acc-soft:#fff1e8;
  --ok:#12b886;--ok-soft:#e3f8ef;--no:#f0506e;--no-soft:#fde8ec;--warn:#f5a524;
  --grad:linear-gradient(135deg,#5b5bf0 0%,#7c4dff 55%,#a855f7 100%);
  --shadow:0 1px 2px rgba(23,26,44,.05),0 8px 24px rgba(60,58,140,.08);
  --shadow-lg:0 2px 6px rgba(23,26,44,.06),0 18px 48px rgba(60,58,140,.16);
  --glass:rgba(255,255,255,.72);--r:20px;
  --font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-en:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1020;--bg2:#151832;--card:#1a1d36;--card2:#20243f;--ink:#eef0fb;--sub:#a3a9c6;--mute:#6f7699;--line:#2a2e4d;
  --pri:#8183ff;--pri2:#a78bfa;--soft:#262a52;--acc:#ff9d66;--acc-soft:#3a2a26;--ok:#34d39e;--ok-soft:#173a32;--no:#ff6b86;--no-soft:#41202b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.4);--glass:rgba(26,29,54,.72)}}
:root[data-theme="dark"]{
  --bg:#0e1020;--bg2:#151832;--card:#1a1d36;--card2:#20243f;--ink:#eef0fb;--sub:#a3a9c6;--mute:#6f7699;--line:#2a2e4d;
  --pri:#8183ff;--pri2:#a78bfa;--soft:#262a52;--acc:#ff9d66;--acc-soft:#3a2a26;--ok:#34d39e;--ok-soft:#173a32;--no:#ff6b86;--no-soft:#41202b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 48px rgba(0,0,0,.4);--glass:rgba(26,29,54,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:360px;background:radial-gradient(60% 60% at 30% 30%,rgba(124,77,255,.16),transparent 70%),radial-gradient(50% 50% at 80% 10%,rgba(255,138,76,.10),transparent 70%);pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.en{font-family:var(--font-en)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh}
#app.session{padding-bottom:300px}
.view{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* top */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.3px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;border:0}
.chip svg.i{width:18px;height:18px}
.chip.fire{color:var(--acc)}
.chip.lv{color:var(--pri)}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow);position:relative}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:14px}.mute{color:var(--mute);font-size:13px}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 36px rgba(91,91,240,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .row{position:relative;z-index:1}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bgc{stroke:rgba(255,255,255,.22)}.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .lbl b{font-size:26px;font-family:var(--font-en)}.ring .lbl span{font-size:12px;opacity:.85}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:6px}.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.stats div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:20px;font-family:var(--font-en)}.stats span{font-size:12px;opacity:.9}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero .bar{background:rgba(255,255,255,.22)}.hero .bar>i{background:#fff}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(91,91,240,.32);transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:none}
.btn.white{background:#fff;color:#4c3ee0;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.no{background:var(--no);box-shadow:0 6px 16px color-mix(in srgb,var(--no) 40%,transparent)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto;padding:8px 14px}
.ibtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;border:0;background:var(--soft);color:var(--pri);flex:none;transition:transform .12s}
.ibtn:active{transform:scale(.92)}
.ibtn.plain{background:transparent;color:var(--sub)}
.btns{display:flex;gap:10px;margin-top:12px}.btns>*{flex:1}
/* story list */
.st{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.st:last-child{border-bottom:0}
.st:hover{background:var(--card2)}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--font-en);flex:none}
.st .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .bar{height:6px;margin-top:6px}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
/* tabbar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 24px));display:flex;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;box-shadow:var(--shadow-lg);padding:6px;z-index:20}
.tabs button{flex:1;border:0;background:none;color:var(--mute);min-height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;transition:color .2s,background .2s}
.tabs button.on{color:var(--pri);background:var(--soft)}
.tabs[hidden]{display:none}
/* session */
.stop{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.stop .bar{flex:1;height:12px}
.combo{font-family:var(--font-en);font-weight:800;color:var(--acc);font-size:14px;min-width:44px;text-align:right;transition:transform .2s}
.combo.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}
.kicker{font-size:13px;font-weight:800;color:var(--pri);letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.pos{display:inline-block;background:var(--soft);color:var(--pri);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:800}
.word{font-family:var(--font-en);font-size:40px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin:10px 0 6px;word-break:break-word}
.word.md{font-size:32px}
.mean{font-size:24px;font-weight:800;line-height:1.35;word-break:keep-all}
.ex{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;font-family:var(--font-en);font-size:17px;line-height:1.6}
.ex .src{display:block;font-family:var(--font);font-size:12px;color:var(--mute);margin-top:8px}
.ex mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--acc) 45%,transparent) 55%);color:inherit;font-weight:800;padding:0 1px}
.tk{cursor:pointer;border-radius:4px}.tk:hover{background:var(--soft)}
.stage{perspective:1400px;touch-action:pan-y;user-select:none}
.drag{transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.flip{position:relative;height:min(480px,64vh);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:28px;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;overflow:auto}
.face.front{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,var(--card),var(--card2))}
.face.back{transform:rotateY(180deg)}
.hint{color:var(--mute);font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center;margin-top:18px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:17px;font-weight:700;box-shadow:0 2px 0 var(--line);transition:transform .1s,border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--bg2);color:var(--sub);font-size:13px;font-family:var(--font-en);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);animation:pulse .6s}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft);animation:shake .4s}
.opt.no .k{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.qcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;text-align:center}
.qcard .ex{text-align:left;margin-top:6px}
.blank{display:inline-block;min-width:84px;border-bottom:3px solid var(--pri);margin:0 2px;height:1.1em;vertical-align:baseline}
.spell{width:100%;font-family:var(--font-en);font-size:24px;font-weight:700;text-align:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card2);margin-top:14px;letter-spacing:.5px}
.spell:focus{border-color:var(--pri);outline:0}
.spell.ok{border-color:var(--ok);background:var(--ok-soft)}.spell.no{border-color:var(--no);background:var(--no-soft)}
.big-play{width:88px;height:88px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:inline-grid;place-items:center;box-shadow:0 10px 28px rgba(91,91,240,.4);margin:8px auto}
.big-play svg.i{width:36px;height:36px}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(480px,100%);background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:18px 18px calc(18px + env(safe-area-inset-bottom));z-index:30;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translate(-50%,0)}
.sheet.ok{background:var(--ok-soft)}.sheet.no{background:var(--no-soft)}
.sheet .ttl{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sheet.ok .ttl{color:var(--ok)}.sheet.no .ttl{color:var(--no)}
/* list */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);min-height:48px}
.search input{flex:1;border:0;background:transparent;font-size:16px;outline:0;min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:38px;padding:0 14px;font-weight:700;font-size:14px;color:var(--sub)}
.fchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.wl{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:58px;cursor:pointer}
.wl:last-child{border-bottom:0}
.wl b{font-family:var(--font-en);font-size:16px}
.wl .ko{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.l{background:var(--warn)}.dot.m{background:var(--ok)}.dot.w{background:var(--no)}
.lv{display:flex;gap:3px}.lv i{width:6px;height:14px;border-radius:3px;background:var(--line)}.lv i.on{background:var(--pri)}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
.empty svg.i{width:40px;height:40px;color:var(--mute);margin-bottom:6px}
/* settings */
.set{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .grow b{display:block;font-size:15px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--pri);min-height:32px}
select,.field{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:8px 12px;font-size:15px}
.field:focus,select:focus{border-color:var(--pri);outline:0}
/* setup */
.drop{border:2px dashed color-mix(in srgb,var(--pri) 45%,var(--line));border-radius:24px;padding:30px 18px;text-align:center;background:var(--card);transition:background .2s,border-color .2s,transform .2s;cursor:pointer}
.drop.over{background:var(--soft);border-color:var(--pri);transform:scale(1.01)}
.drop svg.i{width:44px;height:44px;color:var(--pri)}
.logo{width:64px;height:64px;border-radius:20px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 12px 28px rgba(91,91,240,.35);margin:18px auto 10px}
.logo svg.i{width:34px;height:34px}
.steps{margin:0;padding-left:20px;color:var(--sub);font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px;font-size:13.5px;color:var(--sub)}
.note svg.i{color:var(--pri);width:20px;height:20px;margin-top:1px}
.done-ico{width:96px;height:96px;border-radius:50%;margin:10px auto;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 14px 34px rgba(91,91,240,.4);animation:bounce .8s cubic-bezier(.2,.8,.2,1.4)}
.done-ico svg.i{width:48px;height:48px}
@keyframes bounce{0%{transform:scale(.3)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kv div{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.kv b{display:block;font-size:22px;font-family:var(--font-en)}
.pop{position:fixed;z-index:40;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-lg);font-size:14px;animation:viewIn .18s}
.pop a{color:inherit;font-weight:700}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:50;box-shadow:var(--shadow-lg);animation:viewIn .2s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.green-flash{animation:gflash .5s}
@keyframes gflash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
a{color:var(--pri)}
.opt.trans{font-size:15.5px;font-weight:600;line-height:1.4}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mcol{display:grid;gap:10px;align-content:start}
.mcard{min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:8px 10px;font-weight:700;font-size:14.5px;line-height:1.3;box-shadow:0 2px 0 var(--line);color:var(--ink);transition:transform .1s,border-color .2s,background .2s,opacity .3s}
.mcard.sel{border-color:var(--pri);background:var(--soft);transform:translateY(-2px)}
.mcard.done{border-color:var(--ok);background:var(--ok-soft);opacity:.45}
.mcard.bad{border-color:var(--no);background:var(--no-soft);animation:shake .4s}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:40px;border:0;border-bottom:3px solid var(--pri);background:var(--soft);border-radius:8px;margin:0 3px;padding:2px 10px;font-weight:800;color:var(--mute);vertical-align:middle;font-family:var(--font-en)}
.slot.filled{color:var(--pri)}
.flip.tall{height:min(620px,72vh)}
.dlg{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.bubble{max-width:88%;padding:10px 12px;border-radius:16px;margin:6px 0;font-family:var(--font-en);font-size:15.5px;line-height:1.45}
.bubble b{font-size:12px;opacity:.6;margin-right:4px}
.bubble.a{background:var(--soft);border-bottom-left-radius:4px}

const SFX={ctx:null,out:null,
  init(){try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();
      const comp=this.ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
      this.out=this.ctx.createGain();this.out.connect(comp);comp.connect(this.ctx.destination);}
    if(this.ctx.state==="suspended")this.ctx.resume();}catch(e){}},
  tone(f,t,d,{type="sine",g=.22,a=.006,f2=null,lp=null,det=0}={}){
    const c=this.ctx,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=det;
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+a);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
    let n=o;if(lp){const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
    n.connect(v);v.connect(this.out);o.start(t);o.stop(t+d+.03);},
  play(name,arg){
    if(!st.set.sfx)return;this.init();if(!this.ctx)return;
    this.out.gain.value=Math.max(0,Math.min(1,st.set.vol))*.55;const t=this.ctx.currentTime+.015,T=this.tone.bind(this);
    switch(name){
      case"tick":T(1850,t,.045,{type:"sine",g:.09,a:.002});break;
      case"flip":T(520,t,.09,{type:"triangle",g:.08,f2:880,a:.004});break;
      case"ok":[1046.5,1318.5,1568].forEach((f,i)=>{T(f,t+i*.075,.32,{type:"sine",g:.16});T(f*2,t+i*.075,.18,{type:"sine",g:.035})});break;
      case"no":T(196,t,.26,{type:"triangle",g:.16,f2:165,lp:700});T(198.5,t,.26,{type:"sine",g:.1,f2:166,lp:600,det:8});break;

const TTS={voices:[],
  ok:()=>"speechSynthesis" in window,
  load(){if(!this.ok())return;this.voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))},
  best(){this.load();if(st.set.voice){const v=this.voices.find(v=>v.voiceURI===st.set.voice);if(v)return v}
    const m=st.set.gender==="m",sc=v=>(/en[-_]US/i.test(v.lang)?6:0)+(/natural|neural|online/i.test(v.name)?10:0)+(/google/i.test(v.name)?3:0)
      +((m?/guy|andrew|brian|christopher|eric|davis|male/i:/aria|jenny|ava|emma|michelle|samantha|female/i).test(v.name)?2:0);
    return [...this.voices].sort((a,b)=>sc(b)-sc(a))[0]||null},
  audio:null,bad:new Set(),
  // 표제어 → 미리 생성한 신경망 음성 mp3 경로 (audio/f|m/<audioName>.mp3). 내장 사전에 없는 단어는 null
  wordFile(text){const k=nrm(text),c=ALIAS[k]||k;return KO[c]?`audio/${st.set.gender==="m"?"m":"f"}/${audioName(c)}.mp3`:null},
  stop(){try{if(this.audio){this.audio.pause();this.audio=null}}catch(e){}try{if(this.ok())speechSynthesis.cancel()}catch(e){}},
  phrase(text,{g=null,force=false,onend=null}={}){ // 회화 표현·예문·대화: audio/phrases/f|m/ mp3 우선 → Web Speech 폴백
    if(!(st.set.tts||force)){onend&&onend();return}
    const av=PH.get(text),want=g||(st.set.gender==="m"?"m":"f"),gg=av?(av.has(want)?want:[...av][0]):null;
    const f=gg?`audio/phrases/${gg}/${phraseFile(text)}.mp3`:null;
    if(!f||this.bad.has(f))return this.say(text,force,onend);
    this.stop();let fell=false;const fb=()=>{if(fell)return;fell=true;this.bad.add(f);this.say(text,force,onend)};
    try{const a=new Audio(f);a.playbackRate=st.set.rate;a.preservesPitch=true;this.audio=a;a.onerror=fb;if(onend)a.onended=onend;
      const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=="AbortError")fb()});}catch(e){fb()}},
  word(text,force){ // 단어: mp3 우선 → 실패하면 Web Speech 폴백
    if(typeof PH!=="undefined"&&PH.has(text))return this.phrase(text,{force});
    if(!(st.set.tts||force))return;const f=this.wordFile(text);
    if(!f||this.bad.has(f))return this.say(text,force);
    this.stop();let fell=false;const fb=()=>{if(fell)return;fell=true;this.bad.add(f);this.say(text,force)};
    try{const a=new Audio(f);a.playbackRate=st.set.rate;a.preservesPitch=true;this.audio=a;a.onerror=fb;
      const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=="AbortError")fb()});}catch(e){fb()}},
  say(text,force,onend){if(!this.ok()||!(st.set.tts||force)){onend&&onend();return}try{this.stop();
    const u=new SpeechSynthesisUtterance(String(text).replace(/[()]/g,""));const v=this.best();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=st.set.rate;u.pitch=1;if(onend){u.onend=onend;u.onerror=onend}speechSynthesis.speak(u)}catch(e){onend&&onend()}}};

const FX={c:$("#fx"),parts:[],raf:0,
  burst(x,y,n=26,spread=1){if(RM)return;const cv=this.c;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
    const cols=["#5b5bf0","#8b5cf6","#ff8a4c","#12b886","#f5a524","#e0598b"];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(3+Math.random()*6)*spread;this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5*spread,r:3+Math.random()*4,c:cols[i%cols.length],l:60+Math.random()*30,rot:Math.random()*6})}
    if(!this.raf)this.loop()},
  loop(){const g=this.c.getContext("2d"),d=devicePixelRatio;g.clearRect(0,0,this.c.width,this.c.height);
    this.parts=this.parts.filter(p=>p.l-->0);for(const p of this.parts){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=.15;
      g.save();g.globalAlpha=Math.min(1,p.l/25);g.translate(p.x*d,p.y*d);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.r*d,-p.r*d/2,p.r*2*d,p.r*d);g.restore()}
    this.raf=this.parts.length?requestAnimationFrame(()=>this.loop()):(g.clearRect(0,0,this.c.width,this.c.height),0)}};

async function loadPdf(file){

  $("#tabs").hidden=true;
  const pb=$("#pb"),pt=$("#pt"),setP=(r,m)=>{pb.style.width=(r*100).toFixed(1)+"%";if(m)pt.textContent=m};
  try{
    if(!window.pdfjsLib)throw new Error("PDF 엔진(pdf.js)을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      if(i%4===0||i===pdf.numPages)setP(i/pdf.numPages*.85,`페이지 읽는 중 ${i} / ${pdf.numPages}`);}
    setP(.9,"이야기·챕터·글로서리 찾는 중…");await new Promise(r=>setTimeout(r,30));
    const book=parseBook(pages);

    setP(.95,"단어마다 책 속 예문 찾는 중…");await new Promise(r=>setTimeout(r,30));
    const {words,stat}=buildWords(book,KO,ALIAS);
    BOOK=book;WORDS=words;WMAP=new Map(words.map(w=>[w.id,w]));PARSE_STAT=stat;buildLex();
    st.lastBook=file.name;setMode("book");save();setP(1,"완료!");

}
function buildLex(){LEX=new Map();for(const w of [...WORDS,...st.custom.map(c=>customWord(c))]){const k=nrm(w.disp).replace(/\([^)]*\)/g,"").trim();if(/^[a-z][a-z'-]*$/.test(k)){forms(k).split("|").forEach(f=>{f=f.replace(/\\/g,"");if(!LEX.has(f))LEX.set(f,w)})}}
  for(const k in KO){if(/^[a-z][a-z'-]*$/.test(k)&&!LEX.has(k))LEX.set(k,{disp:k,ko:KO[k].ko,pos:KO[k].pos})}}

function distract(w,field,n=3){
  const A=allWords().filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field]&&(field!=="ko"||x.ko.split(",")[0]!==w.ko.split(",")[0]));
  const same=shuffle(A.filter(x=>x.pos===w.pos)),other=shuffle(A.filter(x=>x.pos!==w.pos));
  const out=[],seen=new Set([w[field]]);for(const x of [...same,...other]){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length>=n)break}
  return out;
}
function ask(){

  else if(type==="cloze"){correct=w.disp;opts=shuffle([correct,...distract(w,"disp")]);
    body=`<div class="kicker">${ic("layers")} 책 속 문장 빈칸 채우기</div><div class="qcard" style="margin-top:10px;text-align:left">${exHTML(ex,{blank:true,tap:false})}<div class="mute" style="margin-top:10px">빈칸에 들어갈 단어(기본형)를 고르세요${w.ko?` · 힌트: ${esc(w.ko)}`:""}</div></div>`}
  else if(type==="listen"){correct=w.disp;
    body=`<div class="kicker">${ic("ear")} 듣고 철자 쓰기</div><div class="qcard" style="margin-top:10px"><button class="big-play" id="sayq" aria-label="다시 듣기">${ic("vol")}</button>
      <div class="sub">${w.ko?`뜻: <b style="color:var(--ink)">${esc(w.ko)}</b> · `:""}${[...nrm(w.disp)].length}글자</div>
      <input class="spell" id="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="들은 단어 입력" placeholder="들리는 단어를 입력">
      <div class="btns"><button class="btn alt sm" id="slow">${ic("ear")} 느리게</button><button class="btn sm" id="chk">확인</button></div></div>`}
  view(head+body+(opts.length?`<div class="opts" role="group" aria-label="보기">${opts.map((o,i)=>`<button class="opt ${type==="en2ko"?"":"en"}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`:"")+`<div class="sheet" id="sheet" role="status" aria-live="assertive"></div>`,{session:true});
  bindQuit();
  if(SES.combo>=2)$("#combo").textContent="×"+SES.combo;

  if(type==="en2ko"&&st.set.auto)setTimeout(()=>TTS.word(w.disp),200);
  let answered=false;
  const resolve=(ok,given)=>{if(answered)return;answered=true;qstat(type==="ko2en_fallback"?"ko2en":type,ok);
    SES.done++;$("#sbar").style.width=(SES.done/SES.total*100)+"%";
    item.tries=(item.tries||0)+1;

function finish(){
  const S=SES,now=Date.now();rollToday();
  const all=[...S.fresh,...S.due];
  for(const w of all){
    const p=D.p[w.id]||(D.p[w.id]={b:0,due:0,ok:0,ng:0,first:now});
    p.last=now;
    if(S.wrongSet.has(w.id)){p.ng++;p.b=1;p.due=now+DAY;D.wrong[w.id]=(D.wrong[w.id]||0)+1}
    else{p.ok++;p.b=Math.min(MASTER,(p.b||0)+1);p.due=p.b>=MASTER?now+90*DAY:now+GAP[p.b]*DAY;if(D.wrong[w.id]&&!S.fresh.includes(w))delete D.wrong[w.id]}
  }
  if(S.mode==="wrong")for(const w of S.due)if(!S.wrongSet.has(w.id))delete D.wrong[w.id];
  D.today.n+=S.fresh.length;
  if(!st.days.includes(tdy())){st.days.push(tdy());st.days=st.days.slice(-400)}
  const bonus=S.fresh.length*5;st.xp+=bonus;
  save();
  const lvUp=level(st.xp)>S.lv0,acc=S.done?Math.round(S.correct/S.done*100):100,gained=st.xp-S.xp0;
  view(`<div style="text-align:center;padding-top:20px">
    <div class="done-ico">${ic(lvUp?"trophy":"check")}</div>
    <h2 style="margin:8px 0 2px;font-size:26px">${lvUp?`레벨 업! Lv.${level(st.xp)}`:"학습 완료!"}</h2>
    <div class="sub">${D.today.n>=D.goal?"오늘의 목표를 달성했어요":"꾸준함이 실력이 돼요"} · 연속 ${streak()}일</div></div>
    <div class="card"><div class="kv">
      <div><b>${S.fresh.length}</b><span class="sub">새 단어</span></div><div><b>${S.due.length}</b><span class="sub">복습</span></div>
      <div><b>${acc}%</b><span class="sub">정답률</span></div><div><b>+${gained}</b><span class="sub">XP</span></div>
      <div><b>${S.best}</b><span class="sub">최고 콤보</span></div><div><b>${S.wrongSet.size}</b><span class="sub">틀린 단어</span></div></div>
    ${S.wrongSet.size?`<div class="mute" style="margin-top:12px">틀린 단어는 오답노트에 담겼고 내일 다시 복습해요.</div>`:""}</div>
    <div class="btns"><button class="btn alt" id="home">${ic("home")} 홈으로</button><button class="btn" id="more">${ic("refresh")} 한 번 더</button></div>`,{session:true});
  SFX.play(lvUp?"level":"done");buzz([20,60,20]);
  setTimeout(()=>{FX.burst(innerWidth/2,innerHeight*.28,70,1.2);if(lvUp)setTimeout(()=>FX.burst(innerWidth/2,innerHeight*.3,60,1.4),400)},120);
  const sc=S.sc;SES=null;
  $("#home").onclick=()=>go("home");$("#more").onclick=()=>startSession(sc,"normal");
  KEY=ev=>{if(ev.key==="Enter")go("home")};
}

const toksOf=s=>nrm(s).replace(/[^\p{L}\p{N}' ]+/gu," ").split(/\s+/).filter(Boolean);
function wordSim(target,given){const T=toksOf(target),G=toksOf(given);if(!T.length)return 0;const bag=new Map();G.forEach(w=>bag.set(w,(bag.get(w)||0)+1));let hit=0;T.forEach(w=>{const c=bag.get(w);if(c){hit++;bag.set(w,c-1)}});return hit/Math.max(T.length,G.length)}
const orderEx=it=>it.ex.find(e=>{const n=e.en.split(/\s+/).length;return n>=4&&n<=13})||null;

    <button class="btn" id="next">${ci+1<fresh.length?"다음":"퀴즈 시작"} ${ic("right")}</button></div>`,{session:true});
  bindQuit();requestAnimationFrame(()=>{const d=$("#drag");if(d){d.style.transform="";d.style.opacity=""}});
  const flip=$("#flip");let flipped=false;
  const doFlip=()=>{flipped=!flipped;flip.classList.toggle("on",flipped);SFX.play("flip");buzz(8);if(flipped&&st.set.auto)TTS.phrase(w.ex[0].en)};
  const next=()=>{SFX.play("tick");if(SES.ci+1<fresh.length){SES.ci++;convCard(1)}else convBuildQuiz()};
  const prev=()=>{if(SES.ci>0){SFX.play("tick");SES.ci--;convCard(-1)}};
  $("#say1").onclick=ev=>{ev.stopPropagation();TTS.phrase(w.disp,{force:true})};$("#say2").onclick=ev=>{ev.stopPropagation();TTS.phrase(w.disp,{force:true})};
  bindPh(flip);flip.querySelectorAll("[data-dlg]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();playDialog(w)});
  $("#next").onclick=next;$("#prev").onclick=prev;
  const drag=$("#drag");let sx=null,sy=0,dx=0,moved=false;
  flip.addEventListener("pointerdown",ev=>{if(ev.target.closest("button,a"))return;sx=ev.clientX;sy=ev.clientY;dx=0;moved=false;drag.style.transition="none"});
  const mv=ev=>{if(sx==null)return;dx=ev.clientX-sx;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(ev.clientY-sy))moved=true;if(moved)drag.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`};
  addEventListener("pointermove",mv,{passive:true});
  flip.addEventListener("pointerup",()=>{if(sx==null)return;drag.style.transition="";const d=dx;sx=null;removeEventListener("pointermove",mv);
    if(moved&&d<-70){drag.style.transform="translateX(-120%)";drag.style.opacity="0";setTimeout(next,RM?0:180)}
    else if(moved&&d>70&&SES.ci>0){drag.style.transform="translateX(120%)";drag.style.opacity="0";setTimeout(prev,RM?0:180)}
    else{drag.style.transform="";if(!moved)doFlip()}});
  flip.addEventListener("pointercancel",()=>{sx=null;drag.style.transition="";drag.style.transform=""});
  flip.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();doFlip()}};
  KEY=ev=>{if(ev.target.tagName==="INPUT")return;if(ev.key==="ArrowRight")next();else if(ev.key==="ArrowLeft")prev();else if((ev.key===" "||ev.key==="Enter")&&ev.target===document.body){ev.preventDefault();doFlip()}else if(ev.key==="s")TTS.phrase(w.disp,{force:true})};
  if(st.set.auto)setTimeout(()=>TTS.phrase(w.disp),RM?0:250);
}

function convTypes(it){const t=["sit"];if(it.ex.some(e=>e.a>=0))t.push("cloze");if(st.set.tts)t.push("dict");if(orderEx(it))t.push("order");if(SRC)t.push("speak");return t}
function convBuildQuiz(){
  planQueue();convAsk();
}
function convDistract(it,n=3){const same=shuffle(CITEMS.filter(x=>x.si===it.si&&x.id!==it.id)),other=shuffle(CITEMS.filter(x=>x.si!==it.si));
  const out=[],seen=new Set([it.disp]);for(const x of [...same,...other]){if(!seen.has(x.disp)){seen.add(x.disp);out.push(x.disp)}if(out.length>=n)break}return out}
const QLABEL={sit:["target","상황에 맞는 표현 고르기"],cloze:["layers","예문 빈칸 채우기"],dict:["ear","듣고 받아쓰기"],order:["list","어순 배열하기"],speak:["vol","한국어 보고 영어로 말하기"]};
function convAsk(){
  if(!SES.queue.length)return finish();
  if(NEWQ[SES.queue[0].t])return NEWQ[SES.queue[0].t](SES.queue[0]);
  const item=SES.queue[0],{w}=item;let type=item.t;
  if(type==="cloze"&&!w.ex.some(e=>e.a>=0))type="sit";
  if(type==="order"&&!orderEx(w))type="sit";
  if(type==="speak"&&!SRC)type="sit";
  if(type==="dict"&&!st.set.tts)type="sit";
  const head=sessTop(SES.done/SES.total*100,"퀴즈 진행"),kick=`<div class="kicker">${ic(QLABEL[type][0])} ${QLABEL[type][1]}</div>`;
  let body="",opts=[],correct=w.disp,ex=null,target="";
  if(type==="sit"){ex=w.ex[Math.random()*2|0];const s=sitText(w);opts=shuffle([correct,...convDistract(w)]);
    body=`<div class="qcard" style="margin-top:10px;text-align:left">${s?`<div class="mute">상황</div><div style="font-weight:700;margin-bottom:10px">${esc(s)}</div>`:""}<div class="mute">하고 싶은 말</div><div class="mean" style="font-size:19px">${esc(ex.ko)}</div></div>`}
  else if(type==="cloze"){ex=shuffle(w.ex.filter(e=>e.a>=0))[0];opts=shuffle([correct,...convDistract(w)]);
    body=`<div class="qcard" style="margin-top:10px;text-align:left"><div class="ex" style="margin-top:0">${esc(ex.en.slice(0,ex.a))}<span class="blank" aria-label="빈칸"></span>${esc(ex.en.slice(ex.b))}</div><div class="mute" style="margin-top:10px">${esc(ex.ko)} · 기본형으로 고르세요</div></div>`}
  else if(type==="dict"){const short=w.disp.split(" ").length<=5;const se=[...w.ex].sort((a,b)=>a.en.length-b.en.length)[0];
    const useExpr=short&&(Math.random()<.5||se.en.split(" ").length>14);ex=useExpr?null:se;target=useExpr?w.disp:se.en;
    body=`<div class="qcard" style="margin-top:10px"><button class="big-play" id="sayq" aria-label="다시 듣기">${ic("vol")}</button>
      <div class="sub">${useExpr?`표현 · 뜻: <b style="color:var(--ink)">${esc(w.ko)}</b>`:`예문 · ${esc(se.ko)}`}</div>
      <input class="spell" id="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="들은 내용 입력" placeholder="들리는 대로 입력">
      <div class="btns"><button class="btn alt sm" id="slow">${ic("ear")} 느리게</button><button class="btn sm" id="chk">확인</button></div></div>`}
  else if(type==="order"){ex=orderEx(w);target=ex.en;
    body=`<div class="qcard" style="margin-top:10px;text-align:left"><div class="mute">${esc(ex.ko)}</div><div class="answer-area" id="ans" aria-label="만든 문장" style="margin-top:10px"></div>
      <div class="tiles" id="pool" style="margin-top:12px"></div><div class="btns"><button class="btn alt sm" id="undo">${ic("left")} 되돌리기</button><button class="btn sm" id="chk" disabled>확인</button></div></div>`}
  else if(type==="speak"){ex=w.ex[Math.random()*2|0];target=ex.en;
    body=`<div class="qcard" style="margin-top:10px"><div class="mute">이 말을 영어로 해 보세요 (힌트: ${esc(w.disp)})</div><div class="mean" style="font-size:19px;margin:8px 0">${esc(ex.ko)}</div>
      <button class="big-play" id="mic" aria-label="말하기 시작">${ic("vol")}</button><div class="sub" id="heard">마이크 버튼을 누르고 말하세요</div>
      <div class="btns"><button class="btn alt sm" id="skip">건너뛰기</button><button class="btn alt sm" id="hearit">${ic("ear")} 정답 듣기</button></div></div>`}
  view(head+kick+body+(opts.length?`<div class="opts" role="group" aria-label="보기">${opts.map((o,i)=>`<button class="opt en" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`:"")+`<div class="sheet" id="sheet" role="status" aria-live="assertive"></div>`,{session:true});
  bindQuit();if(SES.combo>=2)$("#combo").textContent="×"+SES.combo;
